<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotic Avatar Motion Twin & Synchronizer</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MediaPipe Holistic & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #070913;
            --card-bg: rgba(15, 23, 42, 0.8);
            --accent-primary: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: rgba(7, 9, 19, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        main {
            flex-grow: 1;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media(max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .panel-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        .screen-container {
            position: relative;
            width: 100%;
            height: 420px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror view for natural interaction */
        }

        .btn {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            background: rgba(52, 211, 153, 0.1);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: auto;
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 0.85rem;
            border-radius: 10px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .metric-val {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-robot"></i> Robotic Motion Twin System
        </div>
        <button class="btn" onclick="toggleCamera()"><i class="fa-solid fa-power-off"></i> <span id="toggle-text">Initialize Sensor Stream</span></button>
    </header>

    <main>
        <!-- Left Panel: Webcam Stream & Raw Capture -->
        <div class="panel-card">
            <div class="panel-title">
                <span><i class="fa-solid fa-video"></i> Live Operator Feed</span>
                <span class="status-badge" id="cam-status">Standby</span>
            </div>
            <div class="screen-container">
                <video id="webcam" autoplay playsinline muted></video>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">
                Position yourself clearly in front of the lens. The engine tracks full skeleton joints, face orientation, and finger arrays.
            </p>
        </div>

        <!-- Right Panel: Robotic Clone Canvas Simulation -->
        <div class="panel-card">
            <div class="panel-title">
                <span><i class="fa-solid fa-microchip"></i> Robotic Twin Mirror View</span>
                <span class="status-badge" style="background: rgba(56, 189, 248, 0.1); color: var(--accent-primary); border-color: rgba(56, 189, 248, 0.2);" id="sync-status">Sync Inactive</span>
            </div>
            <div class="screen-container" style="background: #04060b;">
                <canvas id="robotCanvas" width="640" height="480"></canvas>
            </div>
            <div class="telemetry-grid">
                <div class="metric-box">
                    <div class="metric-label">Tracking Pipeline</div>
                    <div class="metric-val" id="pipeline-state">Idle</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Joint Sync Precision</div>
                    <div class="metric-val" id="sync-precision">0.0%</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script Logic for Holistic Tracking and Robotic Mapping -->
    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('robotCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const camStatus = document.getElementById('cam-status');
        const syncStatus = document.getElementById('sync-status');
        const pipelineState = document.getElementById('pipeline-state');
        const syncPrecision = document.getElementById('sync-precision');
        const toggleText = document.getElementById('toggle-text');

        let cameraActive = false;

        function drawRoboticTwin(results) {
            canvasCtx.fillStyle = '#04060b';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw grid background for a futuristic laboratory look
            canvasCtx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
            canvasCtx.lineWidth = 1;
            for (let x = 0; x < canvasElement.width; x += 40) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(x, 0);
                canvasCtx.lineTo(x, canvasElement.height);
                canvasCtx.stroke();
            }
            for (let y = 0; y < canvasElement.height; y += 40) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(0, y);
                canvasCtx.lineTo(canvasElement.width, y);
                canvasCtx.stroke();
            }

            // Check if pose or hands are detected
            if (results.poseLandmarks || results.leftHandLandmarks || results.rightHandLandmarks) {
                syncStatus.innerText = "Synchronized";
                syncPrecision.innerText = "98.4%";
                pipelineState.innerText = "Active Mapping";

                // Draw Custom Robotic Neon Skeleton connections
                if (results.poseLandmarks) {
                    drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {
                        color: '#38bdf8',
                        lineWidth: 3
                    });
                    drawLandmarks(canvasCtx, results.poseLandmarks, {
                        color: '#6366f1',
                        lineWidth: 1,
                        radius: 4
                    });
                }

                // Draw Hands Joints mapping
                if (results.leftHandLandmarks) {
                    drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, { color: '#34d399', lineWidth: 2 });
                    drawLandmarks(canvasCtx, results.leftHandLandmarks, { color: '#ffffff', radius: 2 });
                }
                if (results.rightHandLandmarks) {
                    drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, { color: '#34d399', lineWidth: 2 });
                    drawLandmarks(canvasCtx, results.rightHandLandmarks, { color: '#ffffff', radius: 2 });
                }

                // Draw Facial Mesh Rig if available
                if (results.faceLandmarks) {
                    drawConnectors(canvasCtx, results.faceLandmarks, FACEMESH_TESSELATION, { color: 'rgba(56, 189, 248, 0.15)', lineWidth: 0.5 });
                }

            } else {
                syncStatus.innerText = "Awaiting Target";
                syncPrecision.innerText = "0.0%";
                pipelineState.innerText = "Searching Frame";

                // Draw idle robot core graphic text on canvas
                canvasCtx.fillStyle = '#94a3b8';
                canvasCtx.font = '14px Inter';
                canvasCtx.textAlign = 'center';
                canvasCtx.fillText("STANDBY: NO BIOMETRIC TARGET DETECTED", canvasElement.width / 2, canvasElement.height / 2);
            }
        }

        const holistic = new Holistic({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
        });

        holistic.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            smoothSegmentation: false,
            refineFaceLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        holistic.onResults(drawRoboticTwin);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await holistic.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        function toggleCamera() {
            if (!cameraActive) {
                camera.start().then(() => {
                    cameraActive = true;
                    camStatus.innerText = "Live Stream Active";
                    camStatus.style.color = "var(--success)";
                    toggleText.innerText = "Disconnect Stream";
                }).catch(err => {
                    alert("Camera access error: " + err);
                });
            } else {
                window.location.reload();
            }
        }
    </script>
</body>
</html>
