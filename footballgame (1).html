<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Tracking Football - 2 Player / AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b1020;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(90deg, #10265f 0 50%, #5a171b 50% 100%);
  }

  .field-line {
    position: absolute;
    left: 50%;
    top: 0;
    width: 4px;
    height: 100%;
    transform: translateX(-50%);
    background: rgba(255,255,255,.55);
  }

  .center-circle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 180px;
    height: 180px;
    border: 3px solid rgba(255,255,255,.45);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .goal {
    position: absolute;
    top: 50%;
    width: 48px;
    height: 190px;
    transform: translateY(-50%);
    border: 5px solid #fff;
    background: rgba(255,255,255,.08);
  }
  #leftGoal { left: 6px; }
  #rightGoal { right: 6px; }

  #ball {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    box-shadow: 0 0 24px rgba(255,255,255,.85);
    z-index: 7;
  }
  #ball::after {
    content: "⚽";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 35px;
  }

  .player {
    position: absolute;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 6;
    border: 4px solid #fff;
    box-shadow: 0 0 16px rgba(0,0,0,.35);
  }
  #player1 { background: #2563eb; }
  #player2 { background: #dc2626; }

  .tag {
    position: absolute;
    left: 50%;
    top: -27px;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 12px;
    font-weight: bold;
    background: rgba(0,0,0,.55);
    padding: 4px 7px;
    border-radius: 7px;
  }

  #score {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .5px;
    background: rgba(0,0,0,.4);
    padding: 8px 22px;
    border-radius: 15px;
  }

  #modeBadge {
    position: absolute;
    left: 18px;
    top: 18px;
    z-index: 20;
    background: rgba(0,0,0,.4);
    padding: 9px 13px;
    border-radius: 11px;
    font-weight: 700;
  }

  #message {
    position: absolute;
    top: 82px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    background: rgba(0,0,0,.28);
    padding: 7px 13px;
    border-radius: 10px;
  }

  #camera {
    position: absolute;
    right: 14px;
    bottom: 72px;
    width: 210px;
    height: 150px;
    object-fit: cover;
    transform: scaleX(-1);
    border: 2px solid #fff;
    border-radius: 13px;
    opacity: .68;
    z-index: 30;
    display: none;
  }

  #help {
    position: absolute;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    z-index: 20;
    width: min(760px, 90vw);
    text-align: center;
    background: rgba(0,0,0,.55);
    padding: 10px 15px;
    border-radius: 12px;
    font-size: 14px;
  }

  #changeMode {
    position: absolute;
    left: 15px;
    bottom: 15px;
    z-index: 50;
    border: 0;
    border-radius: 10px;
    padding: 10px 13px;
    cursor: pointer;
    font-weight: 700;
  }

  /* Mode selection */
  #menu {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    background: rgba(3,7,18,.86);
    backdrop-filter: blur(6px);
  }

  .menu-card {
    width: min(560px, 92vw);
    padding: 28px;
    border-radius: 22px;
    background: #111827;
    box-shadow: 0 25px 60px rgba(0,0,0,.5);
    text-align: center;
  }

  .menu-card h1 {
    margin: 0 0 9px;
    font-size: 32px;
  }

  .menu-card p {
    margin: 0 0 22px;
    color: #cbd5e1;
  }

  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .mode-btn {
    padding: 20px 12px;
    border: 2px solid #334155;
    border-radius: 16px;
    background: #0f172a;
    color: #fff;
    cursor: pointer;
    font-size: 18px;
    font-weight: 800;
    transition: .15s ease;
  }

  .mode-btn:hover {
    transform: translateY(-2px);
    border-color: #60a5fa;
    background: #172033;
  }

  .mode-btn span {
    display: block;
    margin-top: 7px;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
  }

  #cameraButton {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 13px;
    background: #22c55e;
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
  }

  #status {
    margin-top: 12px;
    min-height: 20px;
    color: #fbbf24;
    font-size: 13px;
  }

  @media (max-width: 650px) {
    .mode-grid { grid-template-columns: 1fr; }
    #camera { width: 150px; height: 110px; }
    #message { font-size: 14px; top: 72px; }
    #score { font-size: 22px; }
  }
</style>
</head>

<body>
<div id="game">
  <div class="field-line"></div>
  <div class="center-circle"></div>
  <div id="leftGoal" class="goal"></div>
  <div id="rightGoal" class="goal"></div>

  <div id="modeBadge">MODE: —</div>
  <div id="score">P1 0 : 0 P2</div>
  <div id="message">Choose a game mode</div>

  <div id="player1" class="player">
    <div class="tag">P1 · LEFT HAND</div>
  </div>
  <div id="player2" class="player">
    <div class="tag" id="p2Tag">P2 · RIGHT HAND</div>
  </div>

  <div id="ball"></div>
  <video id="camera" autoplay muted playsinline></video>

  <div id="help">
    Select <b>2 Player</b> for two hands, or <b>VS COMPUTER</b> for your left hand against the computer.
  </div>

  <button id="changeMode">↩ Change Mode</button>

  <div id="menu">
    <div class="menu-card">
      <h1>⚽ Hand Tracking Football</h1>
      <p>Choose how you want to play.</p>

      <div class="mode-grid">
        <button class="mode-btn" data-mode="2p">
          🖐️ 2 PLAYER
          <span>Left hand = P1 · Right hand = P2</span>
        </button>

        <button class="mode-btn" data-mode="COMPUTER">
          🤖 VS COMPUTER
          <span>Left hand = P1 · COMPUTER = P2</span>
        </button>
      </div>

      <button id="cameraButton">START CAMERA &amp; GAME</button>
      <div id="status">First select a mode, then start the camera.</div>
    </div>
  </div>
</div>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const game = document.getElementById("game");
const player1 = document.getElementById("player1");
const player2 = document.getElementById("player2");
const ball = document.getElementById("ball");
const scoreEl = document.getElementById("score");
const messageEl = document.getElementById("message");
const modeBadge = document.getElementById("modeBadge");
const p2Tag = document.getElementById("p2Tag");
const video = document.getElementById("camera");
const menu = document.getElementById("menu");
const cameraButton = document.getElementById("cameraButton");
const statusEl = document.getElementById("status");
const changeMode = document.getElementById("changeMode");
const help = document.getElementById("help");

let W = innerWidth, H = innerHeight;
let mode = null; // "2p" or "ai"
let running = false;
let cameraStarted = false;

let p1x = W*.25, p1y = H*.5;
let p2x = W*.75, p2y = H*.5;
let bx = W*.5, by = H*.5;
let vx = 360, vy = 80;

let p1Score = 0, p2Score = 0;
let leftHandX = p1x, leftHandY = p1y;
let rightHandX = p2x, rightHandY = p2y;
let leftDetected = false, rightDetected = false;

let lastTime = performance.now();
let lastP1Hit = 0, lastP2Hit = 0;
let aiKickCooldown = 0;

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function dist(ax, ay, bx, by) {
  return Math.hypot(ax-bx, ay-by);
}

function resize() {
  W = innerWidth;
  H = innerHeight;
  p1x = clamp(p1x, 40, W*.48);
  p2x = clamp(p2x, W*.52, W-40);
  p1y = clamp(p1y, 95, H-40);
  p2y = clamp(p2y, 95, H-40);
}
addEventListener("resize", resize);

function resetBall(direction = 1) {
  bx = W*.5;
  by = H*.5;
  vx = 350 * direction;
  vy = (Math.random()-.5) * 260;
}

function updateScore() {
  scoreEl.textContent = `P1 ${p1Score} : ${p2Score} P2`;
}

function hitBall(px, py, power = 1) {
  const dx = bx-px;
  const dy = by-py;
  const d = Math.max(1, Math.hypot(dx,dy));
  vx += (dx/d) * 470 * power;
  vy += (dy/d) * 470 * power;
  vx = clamp(vx, -950, 950);
  vy = clamp(vy, -850, 850);
}

function draw() {
  player1.style.left = p1x + "px";
  player1.style.top = p1y + "px";
  player2.style.left = p2x + "px";
  player2.style.top = p2y + "px";
  ball.style.left = bx + "px";
  ball.style.top = by + "px";
}

function COMPUTERMove(dt) {
  // Computer stays on the right half and reacts to the ball.
  const targetY = by + (vy * 0.10);
  p2y += clamp(targetY - p2y, -360*dt, 360*dt);

  // Slight horizontal movement keeps the COMPUTER on its own side.
  const homeX = W*.76;
  p2x += clamp(homeX - p2x, -120*dt, 120*dt);

  p2x = clamp(p2x, W*.52, W-40);
  p2y = clamp(p2y, 95, H-40);

  // COMPUTER only hits when the ball actually reaches its player.
  if (dist(p2x,p2y,bx,by) < 58 && performance.now()-lastP2Hit > 180) {
    hitBall(p2x, p2y, 1.05);
    lastP2Hit = performance.now();
  }
}

function gameLoop(now) {
  const dt = Math.min((now-lastTime)/1000, .035);
  lastTime = now;

  if (running) {
    // P1 is ALWAYS the physical LEFT hand.
    if (leftDetected) {
      p1x += (leftHandX-p1x) * Math.min(1, dt*13);
      p1y += (leftHandY-p1y) * Math.min(1, dt*13);
    }
    p1x = clamp(p1x, 40, W*.48);
    p1y = clamp(p1y, 95, H-40);

    // P2 behaviour depends on the selected mode.
    if (mode === "2p") {
      // P2 is ALWAYS the physical RIGHT hand.
      if (rightDetected) {
        p2x += (rightHandX-p2x) * Math.min(1, dt*13);
        p2y += (rightHandY-p2y) * Math.min(1, dt*13);
      }
      p2x = clamp(p2x, W*.52, W-40);
      p2y = clamp(p2y, 95, H-40);
    } else if (mode === "COMPUTER") {
      COMPUTERMove(dt);
    }

    // P1 collision.
    if (dist(p1x,p1y,bx,by) < 56 && now-lastP1Hit > 150) {
      hitBall(p1x,p1y,1.18);
      lastP1Hit = now;
    }

    // P2 collision is hand-controlled only in 2P mode.
    if (mode === "2p" && dist(p2x,p2y,bx,by) < 56 && now-lastP2Hit > 150) {
      hitBall(p2x,p2y,1.18);
      lastP2Hit = now;
    }

    bx += vx*dt;
    by += vy*dt;

    // Friction.
    vx *= 0.996;
    vy *= 0.996;

    // Walls.
    if (by < 43) {
      by = 43;
      vy = Math.abs(vy);
    }
    if (by > H-43) {
      by = H-43;
      vy = -Math.abs(vy);
    }

    // Goals.
    if (bx < -10) {
      p2Score++;
      updateScore();
      messageEl.textContent = mode === "COMPUTER" ? "🤖 COMPUTER SCORED!" : "🔴 P2 SCORED!";
      resetBall(1);
    }

    if (bx > W+10) {
      p1Score++;
      updateScore();
      messageEl.textContent = "🔵 P1 SCORED!";
      resetBall(-1);
    }
  }

  draw();
  requestAnimationFrame(gameLoop);
}

const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: .55,
  minTrackingConfidence: .55
});

hands.onResults(results => {
  if (!running) return;

  leftDetected = false;
  rightDetected = false;

  const list = results.multiHandLandmarks || [];
  const handed = results.multiHandedness || [];

  for (let i=0; i<list.length; i++) {
    const tip = list[i][8]; // index fingertip
    const sx = (1-tip.x)*W;
    const sy = tip.y*H;
    const label = handed[i]?.label;

    // MediaPipe labels are based on selfie/mirrored input.
    // Because the actual camera frame is unmirrored, swap labels.
    if (label === "Right") {
      // Physical LEFT hand -> P1.
      leftHandX = sx;
      leftHandY = sy;
      leftDetected = true;
    } else if (label === "Left") {
      // Physical RIGHT hand -> P2 in 2-player mode.
      rightHandX = sx;
      rightHandY = sy;
      rightDetected = true;
    }
  }

  if (mode === "2p") {
    if (leftDetected && rightDetected) {
      messageEl.textContent = "✅ Both hands detected • LEFT=P1 • RIGHT=P2";
    } else if (leftDetected) {
      messageEl.textContent = "🖐️ P1 LEFT hand detected • Show RIGHT hand";
    } else if (rightDetected) {
      messageEl.textContent = "🖐️ P2 RIGHT hand detected • Show LEFT hand";
    } else {
      messageEl.textContent = "🖐️ Show BOTH hands";
    }
  } else if (mode === "ai") {
    messageEl.textContent = leftDetected
      ? "🖐️ LEFT hand controls P1 • 🤖 COMPUTER controls P2"
      : "🖐️ Show your LEFT hand to play";
  }
});

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;

    if (mode === "2p") {
      modeBadge.textContent = "MODE: 2 PLAYER";
      p2Tag.textContent = "P2 · RIGHT HAND";
      help.innerHTML = "🔵 P1 = <b>LEFT HAND</b> &nbsp; | &nbsp; 🔴 P2 = <b>RIGHT HAND</b> &nbsp; | &nbsp; ⚽ Both are human players.";
      statusEl.textContent = "2 Player selected. Start the camera.";
    } else {
      modeBadge.textContent = "MODE: VS COMPUTER";
      p2Tag.textContent = "P2 · COMPUTER";
      help.innerHTML = "🔵 P1 = <b>LEFT HAND</b> &nbsp; | &nbsp; 🔴 P2 = <b>AI</b> &nbsp; | &nbsp; ⚽ Beat the computer.";
      statusEl.textContent = "VS COMPUTER selected. Start the camera.";
    }
  });
});

cameraButton.addEventListener("click", async () => {
  if (!mode) {
    statusEl.textContent = "Please choose 2 Player or VS COMPUTER first.";
    return;
  }

  try {
    if (!cameraStarted) {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480 },
        audio: false
      });

      video.srcObject = stream;
      video.style.display = "block";
      cameraStarted = true;

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({image: video});
        },
        width: 640,
        height: 480
      });
      camera.start();
    }

    menu.style.display = "none";
    running = true;
    resetBall(1);
    messageEl.textContent = mode === "2p"
      ? "🖐️ Show BOTH hands • LEFT=P1 • RIGHT=P2"
      : "🖐️ Show your LEFT hand • 🤖 COMPUTER is ready";
  } catch (err) {
    statusEl.textContent = "Camera permission is required. Use Chrome on localhost or HTTPS.";
    console.error(err);
  }
});

changeMode.addEventListener("click", () => {
  running = false;
  menu.style.display = "grid";
  p1Score = 0;
  p2Score = 0;
  updateScore();
  statusEl.textContent = mode
    ? "Choose another mode, then start the game."
    : "First select a mode.";
});

draw();
updateScore();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
